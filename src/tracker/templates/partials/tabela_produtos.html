{% if produtos %}
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for p in produtos %}
    <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden flex flex-col">
        <!-- Imagem do Produto -->
        <div class="h-48 w-full bg-gray-100 flex items-center justify-center p-4">
            {% if p.imagem_url %}
                <img src="{{ p.imagem_url }}" alt="{{ p.nome }}" class="max-h-full max-w-full object-contain">
            {% else %}
                <span class="text-gray-400 text-sm">Sem imagem</span>
            {% endif %}
        </div>
        
        <!-- Detalhes -->
        <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wide">{{ p.marca or 'Sem marca' }}</span>
                <h3 class="text-sm font-medium text-gray-900 mt-1 line-clamp-2" title="{{ p.nome }}">{{ p.nome }}</h3>
            </div>
            <div class="mt-4 flex items-center justify-between">
                <span class="text-lg font-bold text-green-600">R$ {{ "%.2f"|format(p.preco) }}</span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="bg-white shadow rounded-lg p-10 text-center">
    <p class="text-gray-500 text-lg">Nenhum produto encontrado para esta busca.</p>
</div>
{% endif %}
