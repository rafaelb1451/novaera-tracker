{% if produtos %}
<table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Produto</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Marca</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Preço Atual</th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {% for p in produtos %}
        <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ p.nome }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ p.marca or '-' }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-bold text-green-600">
                R$ {{ "%.2f"|format(p.preco) }}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="p-6 text-center text-gray-500">
    Nenhum produto encontrado.
</div>
{% endif %}
