{% extends "base.html" %}

{% block content %}
<div class="bg-white shadow rounded-lg p-6 mb-8">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Consulta de Preços</h1>
    
    <!-- Input de busca com HTMX (gatilho de digitação) -->
    <div class="relative">
        <input 
            type="text" 
            name="busca" 
            placeholder="Pesquise por um produto específico (ex: arroz, leite)..." 
            class="w-full border-gray-300 rounded-lg shadow-sm px-4 py-3 focus:ring-blue-500 focus:border-blue-500 transition"
            hx-get="/partials/produtos"
            hx-trigger="keyup changed delay:500ms, search"
            hx-target="#lista-produtos"
            hx-indicator="#loading"
        >
        <div id="loading" class="htmx-indicator absolute right-4 top-3 text-blue-600">
            <svg class="animate-spin h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>
    </div>
</div>

<!-- Container onde os produtos serão injetados -->
<!-- O hx-trigger="load" faz a chamada assim que a página abre -->
<div id="lista-produtos" 
     hx-get="/partials/produtos" 
     hx-trigger="load" 
     hx-indicator="#loading">
    <div class="text-center text-gray-500 mt-10">Carregando produtos...</div>
</div>
{% endblock %}
