# Configuração do Alembic para o projeto Nova Era Tracker

[alembic]
# Caminho dos scripts de migration (relativo a este arquivo)
script_location = alembic

# Template usado para gerar migrations
# file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# Fuso horário para timestamps das migrations
timezone = America/Manaus

# A URL do banco é definida em alembic/env.py (via .env)
sqlalchemy.url =


[post_write_hooks]
# Hooks pós-geração (deixe vazio por enquanto)


# ============================================================
# Configuração de logging
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S